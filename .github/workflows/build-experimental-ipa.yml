name: Build Experimental iOS Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          set -euo pipefail

          for xcode_path in \
            "/Applications/Xcode_26.5.app/Contents/Developer" \
            "/Applications/Xcode_26.4.1.app/Contents/Developer" \
            "/Applications/Xcode_26.4.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"
          do
            if [[ -d "$xcode_path" ]]; then
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done

          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Find iOS scheme
        run: |
          set -euo pipefail

          echo "Available schemes:"
          xcodebuild -list -project Strand.xcodeproj

          if xcodebuild -list -project Strand.xcodeproj | grep -q "NOOPiOS"; then
            echo "IOS_SCHEME=NOOPiOS" >> "$GITHUB_ENV"
          elif xcodebuild -list -project Strand.xcodeproj | grep -q "StrandiOS"; then
            echo "IOS_SCHEME=StrandiOS" >> "$GITHUB_ENV"
          else
            echo "Trying to detect iOS scheme..."

            SCHEME=$(xcodebuild -list -project Strand.xcodeproj \
              | awk '/Schemes:/ {found=1; next} found && NF {print $1}' \
              | head -n 1)

            if [ -z "$SCHEME" ]; then
              echo "No scheme found"
              exit 1
            fi

            echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          fi

          echo "Using scheme:"
          cat "$GITHUB_ENV"

      - name: Archive unsigned iOS app
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          ARCHIVE_PATH="$RUNNER_TEMP/NOOP.xcarchive"

          rm -rf "$DERIVED_DATA" "$ARCHIVE_PATH"

          xcodebuild \
            -project Strand.xcodeproj \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            clean archive

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        run: |
          set -euo pipefail

          mkdir -p Payload

          APP_PATH="$ARCHIVE_PATH/Products/Applications"

          if [ ! -d "$APP_PATH" ]; then
            echo "No .app found in archive"
            exit 1
          fi

          cp -R "$APP_PATH"/*.app Payload/

          zip -qry NOOP-experimental-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-experimental-unsigned-ipa
          path: NOOP-experimental-unsigned.ipa
          retention-days: 30

      - name: Create experimental prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental-${{ github.run_number }}
          name: Experimental Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            NOOP-experimental-unsigned.ipa
