# Compile-and-test verification for the Android app.
#
# Debug builds of both flavours with the shared Swift core (Android plan D-5), with unit tests. The
# swift.org toolchain, the Swift SDK for Android (pinned by checksum) and NDK r30 are installed first,
# because android/swift-core/build-swift-core.sh needs them. There is intentionally no signing config,
# no keystore, no secrets, and no artifact publishing here: release APKs are signed by the
# release workflow (Android plan F1). A debug build falls back to the Android debug key
# automatically, so this job needs nothing from the repository owner to pass.
name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # Everything outside android/ the build or the tests read, so a change there runs this job in the
      # push that made it (Android plan D-7). The version name comes from project.yml (D-2); the Swift
      # core is built from Packages/** (D-5), whose fixtures the protocol and schema tests also read.
      # Tests that read Swift app sources or the iOS string catalogue are excluded in
      # android/app/build.gradle.kts, so Strand/** is not an input. Keep this list in step with what
      # the build and the tests read.
      - 'project.yml'
      - 'Packages/**'
      - 'Tools/parity_cases/**'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # Everything outside android/ the build or the tests read, so a change there runs this job in the
      # push that made it (Android plan D-7). The version name comes from project.yml (D-2); the Swift
      # core is built from Packages/** (D-5), whose fixtures the protocol and schema tests also read.
      # Tests that read Swift app sources or the iOS string catalogue are excluded in
      # android/app/build.gradle.kts, so Strand/** is not an input. Keep this list in step with what
      # the build and the tests read.
      - 'project.yml'
      - 'Packages/**'
      - 'Tools/parity_cases/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_TOOLCHAIN_URL: https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz
  SWIFT_SDK_URL: https://download.swift.org/swift-6.4.1-release/android-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_android.artifactbundle.tar.gz
  SWIFT_SDK_SHA256: a356b79f8f1daa6ae3a66f4c556966ca20c0208b3659805cf30a83a0a31d6772
  NDK_VERSION: 30.0.16248370

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Install the Swift toolchain
        run: |
          curl -fsSLo "$RUNNER_TEMP/swift.tar.gz" "$SWIFT_TOOLCHAIN_URL"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"

      - name: Install NDK r30
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          # The image presets ANDROID_NDK_ROOT (and ANDROID_NDK) to its own NDK, which SwiftPM reads too.
          for var in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK; do
            echo "$var=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          done

      - name: Install the Swift SDK for Android
        run: |
          curl -fsSLo "$RUNNER_TEMP/android-sdk.tar.gz" "$SWIFT_SDK_URL"
          echo "$SWIFT_SDK_SHA256  $RUNNER_TEMP/android-sdk.tar.gz" | sha256sum --check
          swift sdk install "$RUNNER_TEMP/android-sdk.tar.gz"
          for dir in "$HOME/.swiftpm/swift-sdks" "$HOME/.config/swiftpm/swift-sdks"; do
            script="$dir/swift-6.4.1-RELEASE_android.artifactbundle/swift-android/scripts/setup-android-sdk.sh"
            if [ -f "$script" ]; then bash "$script"; exit 0; fi
          done
          echo "::error::setup-android-sdk.sh not found in the installed Swift SDK"; exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APKs
        run: ./gradlew assembleFullDebug assembleDemoDebug

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest
