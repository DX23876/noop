# Compile-and-test verification for the Android app.
#
# Debug builds of both flavours, with unit tests. There is intentionally no signing config,
# no keystore, no secrets, and no artifact publishing here: release APKs are signed by the
# release workflow (Android plan F1). A debug build falls back to the Android debug key
# automatically, so this job needs nothing from the repository owner to pass.
name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # Everything outside android/ the build or the tests read, so a change there runs this job in the
      # push that made it (Android plan D-7). The version name comes from project.yml (D-2). The protocol
      # and schema tests compare the Kotlin decoders with the shared fixtures. Tests that read Swift
      # sources or the iOS string catalogue are excluded in android/app/build.gradle.kts, so Strand/** is
      # not an input. Keep this list in step with what the build and the tests read.
      - 'project.yml'
      - 'Packages/WhoopProtocol/Sources/WhoopProtocol/Resources/**'
      - 'Packages/WhoopProtocol/Tests/WhoopProtocolTests/Resources/**'
      - 'Packages/WhoopStore/Tests/WhoopStoreTests/Resources/**'
      - 'Tools/parity_cases/**'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # Everything outside android/ the build or the tests read, so a change there runs this job in the
      # push that made it (Android plan D-7). The version name comes from project.yml (D-2). The protocol
      # and schema tests compare the Kotlin decoders with the shared fixtures. Tests that read Swift
      # sources or the iOS string catalogue are excluded in android/app/build.gradle.kts, so Strand/** is
      # not an input. Keep this list in step with what the build and the tests read.
      - 'project.yml'
      - 'Packages/WhoopProtocol/Sources/WhoopProtocol/Resources/**'
      - 'Packages/WhoopProtocol/Tests/WhoopProtocolTests/Resources/**'
      - 'Packages/WhoopStore/Tests/WhoopStoreTests/Resources/**'
      - 'Tools/parity_cases/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APKs
        run: ./gradlew assembleFullDebug assembleDemoDebug

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest
