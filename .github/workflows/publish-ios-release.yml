name: Publish unsigned iOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric app version already committed to source (for example 10.1.1)"
        required: true
        default: "10.1.1"

permissions:
  contents: write

concurrency:
  group: publish-ios-release
  cancel-in-progress: false

jobs:
  # Swift Packages CI no longer runs on push (see swift-packages.yml), so a release waits on it here
  # and publishes nothing while it is red.
  packages:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/swift-packages.yml

  publish:
    name: Build and publish unsigned IPA
    if: github.ref == 'refs/heads/main'
    needs: packages
    runs-on: macos-26
    timeout-minutes: 60
    # Exposed so the macOS and finalize jobs below attach to the SAME release without re-deriving the
    # tag from the input (one place to be wrong is better than three).
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # MARKETING_VERSION must stay numeric (Apple rejects anything else in
          # CFBundleShortVersionString), so the fork's `-dx` marker lives only in the tag and the asset
          # name — never in the version the app reports, and no longer in the title either. The suffix
          # is a NAMESPACE, not a quality claim: upstream tags `vX.Y.Z` into the same tag space this
          # repo fetches from, so a bare `v10.1.0` here would collide with theirs.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must be numeric X.Y.Z" >&2; exit 1;
          }

          SOURCE_VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
          # Fork-only docs live under docs/fork/ so upstream's docs/ tree stays recognisable in a
          # sync PR; the release notes moved with them. The file is NOT tag-named — it stays
          # `v<VERSION>.md` so `Tools/appchangelog-gen.py` derives a clean version from the filename
          # for the in-app "What's New" card.
          NOTES="docs/fork/releases/v${VERSION}.md"

          [[ "$SOURCE_VERSION" == "$VERSION" ]] || {
            echo "project.yml is $SOURCE_VERSION, not requested $VERSION" >&2; exit 1;
          }
          [[ -f "$NOTES" ]] || {
            echo "Missing release notes: $NOTES" >&2; exit 1;
          }

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}-dx" >> "$GITHUB_ENV"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          echo "IPA=NOOP-ios-unsigned-v${VERSION}-dx.ipa" >> "$GITHUB_ENV"
          echo "FULL_IPA=NOOP-ios-full-unsigned-v${VERSION}-dx.ipa" >> "$GITHUB_ENV"

          # Same two values as job outputs — $GITHUB_ENV is per-job and invisible to the jobs below.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-dx" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          set -euo pipefail
          for xcode_path in \
            "/Applications/Xcode_26.5.app/Contents/Developer" \
            "/Applications/Xcode_26.4.1.app/Contents/Developer" \
            "/Applications/Xcode_26.4.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"
          do
            if [[ -d "$xcode_path" ]]; then
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version

      # NOOPiOS links Vendor/Nomic/llama.xcframework (the on-device semantic-memory runtime) and bundles
      # the pinned Nomic embedding model — both fetched/verified by this script, never committed (it's a
      # ~330 MiB binary pair). Cached on the script's own pinned hashes/tag so a re-run doesn't re-download
      # unless the pin changes.
      - name: Cache Nomic build inputs
        uses: actions/cache@v4
        with:
          path: Vendor/Nomic
          key: nomic-${{ hashFiles('Tools/bootstrap-nomic.sh') }}

      # MUST run BEFORE xcodegen: project.yml adds Vendor/Nomic/Resources as a `buildPhase: resources`
      # directory, and XcodeGen enumerates that directory's CONTENTS at generation time. Bootstrap after
      # generate and the only file there is .gitkeep — the model is silently left out of the project, and
      # the app ships with the runtime but no model to load. That shipped once (9.2.1 Beta 1, a 20 MB IPA
      # where ~350 MB was expected); the size assertion in the packaging step below is what now catches it.
      - name: Bootstrap Nomic embedding runtime + model
        run: Tools/bootstrap-nomic.sh

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iOS Release app
        run: >-
          xcodebuild -project Strand.xcodeproj -scheme NOOPiOS -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/noop-dd"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          DEVELOPMENT_TEAM="" build

      - name: Package AltStore and Full unsigned IPAs
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/noop-dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -1)
          [[ -n "$APP" ]] || { echo "iOS .app not found" >&2; exit 1; }
          [[ ! -e "$APP/embedded.mobileprovision" ]] || {
            echo "Refusing to publish a provisioned IPA" >&2; exit 1;
          }

          # The on-device coach model must actually be IN the bundle. A resource that XcodeGen never saw
          # (see the bootstrap-before-generate note above) produces a perfectly successful build whose
          # semantic memory has no model to load — invisible in the log, and only obvious from the IPA
          # being ~20 MB instead of ~350 MB. Assert the file, not the size, so the check stays true if
          # the model is ever re-quantized.
          MODEL=$(find "$APP" -maxdepth 1 -name '*.gguf' | head -1)
          [[ -n "$MODEL" ]] || {
            echo "No .gguf model in the app bundle — did bootstrap-nomic.sh run before xcodegen?" >&2
            exit 1
          }
          echo "Bundled model: $(basename "$MODEL") ($(du -h "$MODEL" | cut -f1))"

          # Scrub the complete bundle first, including the nested Watch and Widget executables. The
          # packager then preserves that bundle as the Full IPA and strips extensions only from a copy
          # used by AltStore/SideStore with free Apple IDs.
          Tools/anonymize-ios-app.sh "$APP"
          Tools/package-ios-ipas.sh "$APP" "$IPA" "$FULL_IPA"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-iOS-${{ env.VERSION }}
          path: |
            ${{ env.IPA }}
            ${{ env.FULL_IPA }}
          retention-days: 30

      - name: Create or refresh prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          awk 'NR==1 && $0=="---"{frontmatter=1; next} frontmatter && $0=="---"{frontmatter=0; next} !frontmatter{print}' "$NOTES" > "$BODY"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "NOOP Forge $VERSION" --notes-file "$BODY"
          fi
          gh release upload "$TAG" "$IPA" "$FULL_IPA" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to the AltStore and SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIZE=$(stat -f%z "$IPA")
          DATE=$(date -u +%Y-%m-%d)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}"
          DESCRIPTION="NOOP Forge ${VERSION}. See the release notes for what changed."
          tmp=$(mktemp)

          jq --arg version "$VERSION" --arg build "$BUILD" --arg date "$DATE" \
             --arg description "$DESCRIPTION" --arg url "$URL" --argjson size "$SIZE" '
            .apps[0].versions |= ([{
              version: $version,
              buildVersion: $build,
              date: $date,
              localizedDescription: $description,
              downloadURL: $url,
              size: $size,
              minOSVersion: "17.0"
            }] + map(select(.version != $version)))
            | .apps[0].version = $version
            | .apps[0].buildVersion = $build
            | .apps[0].versionDate = $date
            | .apps[0].versionDescription = $description
            | .apps[0].downloadURL = $url
            | .apps[0].size = $size
          ' altstore-source.json > "$tmp"
          mv "$tmp" altstore-source.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add altstore-source.json
          git diff --cached --quiet || git commit -m "Release ${VERSION}: publish sideload source"
          git push origin HEAD:main

  # 9.3.0 onwards the release carries a macOS build too — 9.2.1/9.2.2 were iOS-only, which left
  # Mac users with no artifact at all for a fork whose reference platform IS macOS. Runs AFTER `publish`
  # so the release already exists and this job only has to upload into it. Steps mirror
  # fork-release.yml's proven macOS jobs rather than inventing a second recipe.
  #
  # macos-26, not macos-15: the macOS app targets macOS 13+ and needs no iOS 26 SDK, so macos-15 used
  # to be enough — until its Xcode 16.4 (Swift 6.1.2) started crashing swift-frontend compiling the
  # Strand module (x86_64 module emission, then SILGen on the arm64 slice under whole-module mode). The
  # macos-26 toolchain builds the same sources cleanly (matches app-build.yml's fix, ee8fd84f2), so this
  # now waits for a macos-26 runner like the iOS legs already did.
  #
  # One slice per job, merged with lipo in `macos` below, the same split fork-testing-build.yml made in
  # cd927823b and fork-release.yml in 5ab07c89d. This job used to build Debug in one `ARCHS="x86_64
  # arm64"` invocation, which only fit its 40 min timeout because Debug skips the whole-module compile.
  # Release runs both whole-module compiles of the Strand module at once on the runner's 3 cores, and
  # that phase alone passed 31 min on the testing build (2026-10-16 and -17). Each slice now has a
  # runner to itself, so the critical path is one compile, not two sharing a CPU.
  macos-slice:
    name: Build macOS slice (${{ matrix.arch }})
    needs: publish
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v5
        with:
          # The exact commit the release was tagged at, NOT `main`: `publish` pushes an
          # altstore-source.json commit, so `main` has already moved on by the time this runs.
          ref: ${{ github.sha }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NOOP.app (macOS, unsigned, ${{ matrix.arch }})
        # #51: 'platform=macOS' on an Apple-Silicon runner resolves to the host arch and thins the binary
        # to arm64-only. That shipped an arm64-only app that will not launch on Intel. The generic
        # destination + explicit ARCHS/ONLY_ACTIVE_ARCH override whatever the configuration says, so the
        # x86_64 slice is really x86_64; the merge job verifies every Mach-O carries both.
        #
        # #2393: Release, matching the iOS leg, for the reasons spelled out in fork-release.yml: the Debug
        # artefact was a 120 KB stub plus a 195 MB `.debug.dylib` and a `__preview.dylib`, and it cost a
        # measurable share of a CPU core at idle. Release also drops `#if DEBUG` code (previews, sample
        # data, the `--demo-sync` screenshot harness), as the iOS artefact always has. Use a local Debug
        # build for the harness.
        run: >-
          xcodebuild -scheme Strand -configuration Release
          -destination 'generic/platform=macOS' ARCHS="${{ matrix.arch }}" ONLY_ACTIVE_ARCH=NO
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Archive the slice
        # tar, not the artifact zip: the bundle carries framework symlinks the artifact store would flatten.
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::.app not found"; exit 1; }
          for f in "$APP/Contents/MacOS/"*; do echo "${f##*/}: $(lipo -archs "$f")"; done
          tar -C "$(dirname "$APP")" -cf "slice-${{ matrix.arch }}.tar" "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-slice-${{ matrix.arch }}
          path: slice-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  macos:
    name: Build and attach macOS app
    needs: [publish, macos-slice]
    runs-on: macos-26
    timeout-minutes: 15
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      VER: ${{ needs.publish.outputs.version }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-slice-*
          merge-multiple: true

      - name: Merge the slices into a universal NOOP.app
        # Every Mach-O in the arm64 bundle is joined with its x86_64 twin; everything else is taken from the
        # arm64 bundle. A Mach-O present in only one slice, or one lipo refuses (both already the same arch),
        # fails the merge rather than shipping a bundle that is universal in its main binary only.
        run: |
          set -euo pipefail
          mkdir -p arm64 x86_64 universal
          tar -C arm64 -xf slice-arm64.tar
          tar -C x86_64 -xf slice-x86_64.tar
          NAME=$(cd arm64 && ls -d *.app | head -1)
          test -d "x86_64/$NAME" || { echo "::error::the slices built different bundles ($NAME missing from x86_64)"; exit 1; }
          ditto "arm64/$NAME" "universal/$NAME"
          merged=0
          while IFS= read -r -d '' f; do
            rel="${f#arm64/$NAME/}"
            lipo -archs "$f" >/dev/null 2>&1 || continue
            test -f "x86_64/$NAME/$rel" || { echo "::error::$rel has no x86_64 twin"; exit 1; }
            lipo -create "$f" "x86_64/$NAME/$rel" -output "universal/$NAME/$rel"
            merged=$((merged + 1))
          done < <(find "arm64/$NAME" -type f -print0)
          while IFS= read -r -d '' f; do
            rel="${f#x86_64/$NAME/}"
            lipo -archs "$f" >/dev/null 2>&1 || continue
            test -f "arm64/$NAME/$rel" || { echo "::error::$rel exists only in the x86_64 slice"; exit 1; }
          done < <(find "x86_64/$NAME" -type f -print0)
          echo "merged $merged Mach-O file(s)"
          # Resources come from one compile of the same commit; a difference is worth seeing, not fatal.
          { diff -rq "arm64/$NAME" "x86_64/$NAME" || true; } | while IFS= read -r line; do
            f=$(printf '%s' "$line" | sed -E 's/^Files (.*) and .* differ$/\1/')
            [ "$f" != "$line" ] && lipo -archs "$f" >/dev/null 2>&1 && continue
            echo "::warning::slices differ outside Mach-O: $line"
          done

      - name: Verify universal binary
        run: |
          APP=$(find universal -maxdepth 1 -name '*.app' -type d | head -1)
          bad=0
          while IFS= read -r -d '' f; do
            archs=$(lipo -archs "$f" 2>/dev/null) || continue
            echo "${f#universal/}: $archs"
            { echo "$archs" | grep -qw x86_64 && echo "$archs" | grep -qw arm64; } || bad=1
          done < <(find "$APP" -type f -print0)
          [ "$bad" -eq 0 ] || { echo "::error::macOS bundle is not universal (expected x86_64 + arm64 in every Mach-O)"; exit 1; }

      - name: Package + attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find universal -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::.app not found"; exit 1; }
          # #429: ad-hoc sign the BUNDLE so it has a stable per-build code identity. macOS 26 (Tahoe)
          # will not bind a Bluetooth TCC grant to an UNSIGNED bundle, so users wedge at CBManagerState
          # .unauthorized even after a fresh `tccutil reset` + approve. `--sign -` gives a real
          # cdhash-based designated requirement TCC can grant to. No --entitlements / --options runtime:
          # the app stays non-sandboxed so Bluetooth goes through plain TCC + the Info.plist usage string.
          codesign --force --deep --sign - "$APP"
          ZIP="NOOP-macos-v${VER}-dx.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $ZIP ($(du -h "$ZIP" | cut -f1))"

  # `publish` creates the release as a PRERELEASE so a half-uploaded release is never the newest thing
  # users see. GitHub's releases/latest EXCLUDES prereleases, and the in-app update check reads exactly
  # that endpoint — so a release left as a prerelease is invisible to every installed app. Flip it only
  # once BOTH artifacts are attached.
  finalize:
    name: Mark the release latest
    needs: [publish, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Promote out of prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

          # `gh release view --json` has no isLatest field (it turned this step red on 9.3.0 even though
          # the edit above had already succeeded). Ask the API what releases/latest actually resolves to
          # instead — that is the endpoint the in-app update check reads, so it is the honest assertion.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,isPrerelease,isDraft,assets \
            --jq '"\(.name) prerelease=\(.isPrerelease) draft=\(.isDraft) assets=\([.assets[].name]|join(", "))"'
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "releases/latest -> $LATEST"
          [ "$LATEST" = "$TAG" ] || { echo "::error::releases/latest is $LATEST, expected $TAG"; exit 1; }
